<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3c8">
<title>TT Jigsaw · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%23a46ee8'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%96%BC%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🖼️', '#a46ee8');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffd400;
    --pink: #ff3d7f;
    --cyan: #18d4ff;
    --mint: #3fe0b0;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
    /* JG.board.layout's bars (js/game.js sets them): the top bar's height, the round buttons at the bottom */
    --top: 64px;
    --cb: 84px;
    --gut: 58px;
    --ib: clamp(42px, 6.4vmin, 58px);
    /* the kit's ? and language buttons: the middle of the left edge, in the gutter the table keeps free */
    --kh-top: calc(50% - 20px);
    --kl-top: calc(50% + 28px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; color: #fff;
    background: radial-gradient(circle at 30% 20%, #d6fff4, #8fd3c8 55%, #5bb3b8);
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #table, #stage, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #table { z-index: 1; }
  #table.grab { cursor: grabbing; }
  #stage { z-index: 3; pointer-events: none; }
  #fx { pointer-events: none; z-index: 8; }
  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  /* ---------- big chunky buttons ---------- */
  .bigbtn {
    min-width: clamp(70px, 12vmin, 104px); height: clamp(70px, 12vmin, 104px); border-radius: 26px; padding: 0 18px;
    font-size: clamp(36px, 6.4vmin, 54px); line-height: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(160deg, #ffffff, #e9e3ff); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink); color: var(--ink);
    transition: transform 0.08s;
  }
  .bigbtn.go { background: linear-gradient(160deg, #8ef56b, #2dbf4e); color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .bigbtn .word { font-family: var(--display); font-size: clamp(20px, 4vmin, 34px); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); color: #fff; }
  .bigbtn:active, .tile:active, .seg button:active, .ibtn:active, .sortbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .ibtn {
    width: var(--ib); height: var(--ib); border-radius: 16px; font-size: calc(var(--ib) * 0.52); line-height: 1;
    display: grid; place-items: center; background: rgba(255, 255, 255, 0.92); border: 4px solid #fff; box-shadow: 0 5px 0 var(--ink);
  }

  /* ---------- home ---------- */
  #home { position: fixed; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(6px, 1.5vh, 16px); transition: opacity 0.3s; padding: 10px; }
  @media (min-aspect-ratio: 105/100) { #home { left: 47vw; right: max(8px, env(safe-area-inset-right)); top: 0; bottom: 0; } }
  @media (max-aspect-ratio: 105/100) { #home { left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom)); height: 63vh; justify-content: flex-start; padding-left: 62px; } }
  .logo { text-align: center; font-family: var(--display); line-height: 0.92; transform: rotate(-3deg); }
  .logo small { display: block; font-size: clamp(26px, 5vmin, 44px); color: var(--cyan); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .logo big { display: block; font-size: clamp(40px, 9vmin, 92px); color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 12px 24px rgba(0,0,0,.2); letter-spacing: 1px; }
  .tagline { font-family: var(--display); font-size: clamp(13px, 2.4vmin, 21px); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); text-align: center; }
  .tiles { display: grid; grid-template-columns: repeat(3, auto); gap: clamp(6px, 1.4vmin, 14px); justify-content: center; }
  .tile {
    position: relative; width: clamp(84px, 14vmin, 140px); aspect-ratio: 3 / 2.3; border-radius: 18px; border: 4px solid #fff;
    box-shadow: 0 6px 0 var(--ink); overflow: hidden; transition: transform 0.08s; padding: 0; background: #fff;
    display: flex; flex-direction: column;
  }
  .tile img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; background: linear-gradient(160deg, var(--a, #fff), var(--b, #ccc)); }
  .tile b { flex: 1; display: grid; place-items: center; font-family: var(--display); font-weight: 400; font-size: clamp(9px, 1.6vmin, 14px); color: var(--ink); line-height: 1; padding: 0 3px; text-align: center; background: #fff; }
  .tile:hover { transform: translateY(-3px) rotate(-1deg); }
  .tile.last { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--ink), 0 6px 0 3px var(--ink); }
  .tile kbd { position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 7px; background: #fff; color: var(--ink); font: 400 13px/18px var(--display); text-align: center; border: 2px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .tile kbd { display: none; } }
  .opts { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2vh, 11px); }
  .seg { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .seg button {
    display: flex; align-items: center; gap: 7px; height: clamp(46px, 7.4vmin, 62px); padding: 0 13px 0 9px; border-radius: 20px; border: 4px solid #fff;
    background: rgba(255, 255, 255, 0.55); box-shadow: 0 5px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(13px, 2.4vmin, 20px); transition: transform 0.12s;
  }
  .seg button img { height: 80%; aspect-ratio: 1; border-radius: 13px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .seg button .emo { font-size: 1.25em; }
  .seg button.on { background: linear-gradient(160deg, #fffbe0, #ffd84a); border-color: var(--yellow); box-shadow: 0 0 0 4px var(--ink), 0 6px 0 4px var(--ink); transform: scale(1.05); }
  #segSize button { padding: 0 11px; min-width: clamp(46px, 7.4vmin, 62px); justify-content: center; }
  #segSize .lbl { font-size: 1.25em; }
  .duo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: clamp(15px, 2.8vmin, 24px); color: var(--ink); background: rgba(255,255,255,.55); border: 4px solid #fff; border-radius: 20px; padding: 4px 14px 4px 6px; box-shadow: 0 5px 0 var(--ink); }
  .duo img { width: clamp(40px, 6.4vmin, 56px); aspect-ratio: 1; border-radius: 13px; background: radial-gradient(circle at 50% 35%, #ffffff, #b9e6ff); }
  .duo .vs { color: var(--pink); }
  @media (max-width: 520px) {
    .logo big { font-size: 40px; -webkit-text-stroke-width: 3px; } .tagline { font-size: 12px; }
    .tile { width: 92px; border-radius: 14px; } .tile b { font-size: 9px; }
    .seg button { height: 44px; font-size: 13px; }
  }
  @media (max-height: 520px) {
    /* a phone on its side: the menu a size smaller, the options in a row */
    #home { gap: 4px; padding: 4px; }
    .logo small { font-size: 16px; -webkit-text-stroke-width: 2px; }
    .logo big { font-size: 30px; text-shadow: 0 4px 0 var(--ink); -webkit-text-stroke-width: 3px; }
    .tagline { display: none; }
    .tiles { grid-template-columns: repeat(6, auto); gap: 5px; }
    .tile { width: 58px; border-width: 3px; border-radius: 12px; box-shadow: 0 4px 0 var(--ink); }
    .tile b { display: none; }
    .tile img { aspect-ratio: 1 / 1; }
    .tile { aspect-ratio: 1 / 1; }
    .seg button img { display: none; }
    .opts { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 5px 7px; max-width: 100%; }
    .seg button { height: 38px; font-size: 11px; border-radius: 13px; padding: 0 7px 0 5px; gap: 4px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
    #segSize button { min-width: 36px; padding: 0 6px; }
    .seg { gap: 4px; }
    .duo { font-size: 12px; padding: 2px 8px 2px 4px; }
    .duo img { width: 30px; }
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; transition: opacity 0.3s; }
  #hud button { pointer-events: auto; position: fixed; }
  .bar { position: fixed; top: 0; height: var(--top); left: var(--gut); right: calc(var(--ib) * 2 + 30px); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; pointer-events: none; }
  .side { display: flex; align-items: center; gap: clamp(4px, 1vmin, 8px); border-radius: 999px; padding: 3px 10px 3px 3px; background: rgba(20, 18, 31, 0.55); border: 3px solid #fff; transition: box-shadow 0.2s; }
  #sideR { padding: 3px 3px 3px 10px; }
  .side.lead { box-shadow: 0 0 0 3px var(--yellow); }
  .side .face { position: relative; display: block; line-height: 0; border-radius: 50%; }
  .side img { width: calc(var(--top) * 0.66); height: calc(var(--top) * 0.66); max-width: 52px; max-height: 52px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); display: block; }
  .side b { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 3.8vmin, 34px); line-height: 1; color: var(--yellow); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .side b.bump { animation: bump 0.4s cubic-bezier(.3, 1.8, .5, 1); }
  .side small { font-family: var(--display); font-size: clamp(11px, 2vmin, 16px); color: #fff; white-space: nowrap; }
  .wins { position: absolute; bottom: -5px; right: -8px; padding: 2px 4px 1px; border-radius: 999px; background: var(--ink); border: 2px solid #fff; font-family: var(--display); font-weight: 400; font-size: clamp(10px, 1.7vmin, 13px); color: var(--yellow); line-height: 1; white-space: nowrap; }
  .wins:empty { display: none; }
  @keyframes bump { 40% { transform: scale(1.4) rotate(-6deg); } }
  .mid { display: flex; align-items: center; gap: 8px; }
  #hud .lid { position: static; pointer-events: auto; height: calc(var(--top) - 12px); aspect-ratio: 3 / 2; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 4px 0 var(--ink); overflow: hidden; background: #fff; }
  .lid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clock { font-family: var(--display); font-size: clamp(16px, 3.2vmin, 28px); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); font-variant-numeric: tabular-nums; }
  #pauseBtn { top: calc((var(--top) - var(--ib)) / 2); right: calc(var(--ib) + 18px); }
  #muteBtn { top: calc((var(--top) - var(--ib)) / 2); right: 10px; }
  /* sort the edges: bottom left, under the left tray */
  #sortBtn { left: calc(var(--gut) + 8px); bottom: max(calc((var(--cb) - var(--cb) * 0.82) / 2 + 4px), env(safe-area-inset-bottom)); height: calc(var(--cb) * 0.82); }
  .sortbtn { display: flex; align-items: center; gap: 8px; padding: 0 16px 0 10px; border-radius: 22px; background: linear-gradient(160deg, #ffffff, #e2f6ff); border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink); color: var(--ink); font-family: var(--display); font-size: clamp(14px, 2.6vmin, 22px); }
  .sortbtn .emo { font-size: 1.6em; line-height: 1; }
  .sortbtn kbd { width: 24px; height: 24px; border-radius: 7px; background: #fff; color: var(--ink); font: 400 13px/20px var(--display); text-align: center; border: 2px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .sortbtn kbd { display: none; } }
  body[data-short="1"] .sortbtn { font-size: 12px; padding: 0 10px 0 6px; }

  /* your brother's button (1 player) / the high five (2 players): bottom right, big */
  .callbtn {
    position: fixed; z-index: 7; right: max(10px, env(safe-area-inset-right)); bottom: max(calc((var(--cb) - var(--cb) * 0.94) / 2 + 2px), env(safe-area-inset-bottom));
    width: calc(var(--cb) * 0.94); aspect-ratio: 1; border-radius: 50%; padding: 5px;
    background: linear-gradient(135deg, #ffb02e, #ff7a1a); border: 5px solid #fff; box-shadow: 0 7px 0 var(--ink);
    display: grid; place-items: center; line-height: 1;
  }
  .callbtn img { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); }
  .callbtn kbd { position: absolute; left: -6px; top: -6px; width: 28px; height: 28px; border-radius: 9px; background: #fff; color: var(--ink); font: 400 15px/24px var(--display); text-align: center; border: 3px solid var(--ink); }
  @media (hover: none) and (pointer: coarse) { .callbtn kbd { display: none; } }
  .callbtn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .callbtn.here { animation: glow 1.1s ease-in-out infinite; border-color: var(--yellow); }
  @keyframes glow { 50% { box-shadow: 0 0 30px 8px rgba(255, 212, 0, 0.9), 0 7px 0 var(--ink); } }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; left: 50%; top: calc(var(--top) + 10px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; z-index: 9; width: 96vw; }
  .toast {
    font-family: var(--display); font-size: clamp(18px, 4vmin, 36px); color: var(--yellow); max-width: 94vw; text-align: center;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: toast 2s ease-out forwards;
  }
  .toast.save { color: #ffe066; font-size: clamp(20px, 4.6vmin, 42px); animation-duration: 2.4s; }
  .toast.treat { color: #fff; }
  .toast.buddy { color: #ffb02e; }
  .toast.rival { color: #ff8fc0; }
  .toast.hint { color: #fff; font-size: clamp(15px, 3.2vmin, 26px); }
  @keyframes toast { 0% { transform: scale(0.4); opacity: 0; } 12% { transform: scale(1.12); opacity: 1; } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { transform: translateY(-24px); opacity: 0; } }

  /* ---------- overlays: the peek, the finish, pause ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(20, 18, 31, 0.35); transition: opacity 0.25s; padding: 14px; }
  #peek { cursor: pointer; }
  #peek img { max-width: min(86vw, 900px); max-height: 78vh; border-radius: 18px; border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); }
  #over { place-items: end center; background: linear-gradient(transparent 40%, rgba(20, 18, 31, 0.4)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.6vh, 14px); padding: clamp(12px, 2.6vmin, 24px); border-radius: 34px; background: linear-gradient(170deg, #fff8e6, #ffe2b8); border: 6px solid #fff; box-shadow: 0 10px 0 var(--ink); color: var(--ink); max-width: 96vw; }
  .rhead { display: flex; align-items: center; gap: 14px; }
  .rface img { width: clamp(52px, 10vmin, 90px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); border: 4px solid #fff; box-shadow: 0 4px 0 var(--ink); animation: pop 0.5s cubic-bezier(.3, 1.8, .5, 1); display: block; }
  @keyframes pop { from { transform: scale(0.3); } }
  .rtitle { font-family: var(--display); font-size: clamp(26px, 5.6vmin, 52px); line-height: 1.05; text-align: center; color: var(--yellow); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); max-width: 70vw; }
  .rscore { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: clamp(18px, 3.6vmin, 32px); flex-wrap: wrap; justify-content: center; }
  .rscore img { width: 1.4em; height: 1.4em; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #fff3d0, #ffd27a); vertical-align: middle; }
  .rscore span { display: inline-flex; align-items: center; gap: 6px; }
  .rscore .best { color: #c06a00; }
  .rbtns { display: flex; gap: clamp(12px, 2.6vmin, 24px); align-items: center; }
  #pause .panel { flex-direction: row; gap: 22px; }
  @media (max-height: 520px) {
    .panel { gap: 5px; padding: 8px 16px; border-radius: 24px; }
    .rface img { width: 44px; }
    .rtitle { font-size: 24px; -webkit-text-stroke-width: 3px; }
    .rscore { font-size: 16px; }
    .bigbtn { height: 54px; min-width: 54px; font-size: 28px; border-radius: 18px; } .bigbtn .word { font-size: 17px; }
  }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #8fd3c8; font-size: 80px; transition: opacity 0.4s; }
  #loading span { animation: bump 0.8s infinite; display: inline-block; }
  @media (prefers-reduced-motion: reduce) { .callbtn.here { animation: none; } }
</style>
</head>
<body>
<canvas id="table"></canvas>
<canvas id="stage"></canvas>
<canvas id="fx"></canvas>

<!-- home -->
<div id="home">
  <div class="logo" id="logo"><small></small><big></big></div>
  <div class="tagline">🧩 PUT THE PICTURE BACK TOGETHER!</div>
  <div class="tiles" id="tiles"></div>
  <div class="opts">
    <div class="seg" id="segMode" aria-label="Players">
      <button data-v="alone"><span class="emo">👤</span>ALONE</button>
      <button data-v="race"><img alt="" draggable="false" id="rivalImg">RACE</button>
      <button data-v="two"><span class="emo">👥</span>2 PLAYERS</button>
    </div>
    <div class="seg" id="segWho" aria-label="Who are you?">
      <button data-v="teddy"><img alt="" draggable="false">TEDDY</button>
      <button data-v="tommy"><img alt="" draggable="false">TOMMY</button>
    </div>
    <div class="duo hidden" id="duo"><img id="duoA" alt="" draggable="false"><span>TEDDY</span><span class="vs">&amp;</span><span>TOMMY</span><img id="duoB" alt="" draggable="false"></div>
    <div class="seg" id="segLevel" aria-label="Level">
      <button data-v="easy"><span class="emo">🐣</span>EASY</button>
      <button data-v="normal"><span class="emo">🔥</span>NORMAL</button>
    </div>
    <div class="seg" id="segSize" aria-label="Pieces">
      <button data-v="6"><span class="lbl">🧩</span>6</button>
      <button data-v="12">12</button>
      <button data-v="20">20</button>
      <button data-v="35">35</button>
      <button data-v="54">54</button>
      <button data-v="100">100</button>
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="bar">
    <div class="side" id="sideL"><span class="face"><img id="faceL" alt=""><span class="wins" id="winsL"></span></span><b id="leftL">0</b><small id="subL"></small></div>
    <div class="mid"><button class="lid" id="lid" title="The picture (B)" aria-label="The picture"><img id="lidImg" alt=""></button><span class="clock" id="clock"></span></div>
    <div class="side" id="sideR"><small id="subR"></small><b id="leftR">0</b><span class="face"><img id="faceR" alt=""><span class="wins" id="winsR"></span></span></div>
  </div>
  <button class="ibtn" id="pauseBtn" title="Pause (P)" aria-label="Pause">⏸️</button>
  <button class="ibtn" id="muteBtn" title="Sound (M)" aria-label="Sound on or off">🔊</button>
  <button class="sortbtn" id="sortBtn" title="Corners and edges first (E)" aria-label="Corners and edges first"><span class="emo">🖼️</span>EDGES<kbd>E</kbd></button>
</div>
<button class="callbtn hidden" id="callBtn" aria-label="Call your brother"><img id="callFace" alt=""><kbd>T</kbd></button>

<div id="toasts"></div>

<div id="peek" class="overlay hidden"><img id="peekImg" alt=""></div>

<!-- the picture's finished -->
<div id="over" class="overlay hidden">
  <div class="panel">
    <div class="rhead"><div class="rface" id="oFace"></div><div class="rtitle" id="oTitle"></div></div>
    <div class="rscore" id="oScore"></div>
    <div class="rbtns">
      <button class="bigbtn go" id="oAgain" aria-label="Play again"><span class="word">PLAY AGAIN</span></button>
      <button class="bigbtn" id="oNext" aria-label="Next picture">➡️</button>
      <button class="bigbtn" id="oHome" aria-label="Home">🏠</button>
    </div>
  </div>
</div>

<!-- pause -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <button class="bigbtn go" id="pResume" aria-label="Keep playing">▶</button>
    <button class="bigbtn" id="pRestart" aria-label="Start again">🔄</button>
    <button class="bigbtn" id="pHome" aria-label="Home">🏠</button>
  </div>
</div>

<div id="loading"><span>🧩</span></div>
